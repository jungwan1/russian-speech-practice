<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#f6f7f9;color:#17202a}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px}

@media(max-width:600px){.ru{font-size:24px;line-height:1.8} button{flex:1 1 auto} .ko{font-size:17px}}
</style></head><body>

<div class="headRow"><span class="headLabel">준비된 해설</span>
<nav class="topnav" id="topNav" aria-label="항 선택">

<script>
const CARDS=[
{tag:"6항",q:"",ko:"요나단은 다윗을 진심으로 사랑했기 때문에, 여호와께서 왕이 될 사람으로 다윗을 선택하셨다는 사실을 알고도 시기하지 않았습니다. 우리 마음속에 형제자매들에 대한 그런 사랑을 키우면 질투심이나 시기심 같은 부정적인 감정이 자라지 않는 데 도움이 될 수 있습니다.",ru:["Ионафа́н не зави́довал Дави́ду, а счита́л его́ дру́гом, потому́ что по-настоя́щему люби́л его́.","Он был смире́нным и по́лностью подде́рживал Дави́да, хотя́ зна́л, что Иего́ва вы́брал его́ сле́дующим царём Изра́иля.","Если́ мы бу́дем люби́ть бра́тьев и сестёр, в на́шем се́рдце не оста́нется ме́ста для за́висти."]},
{tag:"10항",q:"",ko:"다툼이 심해지는 것을 원하지 않았기 때문에, 이삭은 평화를 위해 여러 번 이주하면서 참을성과 온화를 나타냈습니다.",ru:["Исаа́к не позво́лил, что́бы спор ме́жду его́ пастуха́ми и филистимля́нами переро́с в серьёзный конфли́кт.","Он стреми́лся к ми́ру, поэ́тому сно́ва уступи́л и перешёл в друго́е ме́сто.","Так он проявля́л кро́тость и терпе́ние."]},
{tag:"12항",q:"",ko:"그들을 미워하거나 똑같이 응수하려고 하지 말고, 우리를 반대하는 사람들에게도 친절과 참을성과 존중심을 나타내야 합니다.",ru:["Мы не должны́ ненави́деть тех, кто нас пресле́дует, и́ли отпла́чивать им злом за зло́.","Сле́дуя призы́ву Иису́са, мы стара́емся проявля́ть доброту́, терпе́ние и уваже́ние ко всем, да́же к тем, кто нам противоде́йствует."]},
{tag:"복습 1",q:"사탄은 어떻게 우리의 연합을 깨뜨리려고 합니까?",ko:"우리가 세상의 영향을 받아 형제자매들을 시기하고 질투하고 비판하게 만들고, 우리 사이에 분열과 불화를 일으켜 연합을 깨뜨리려고 합니다.",ru:["Сатана́ пыта́ется разру́шить на́ше еди́нство с бра́тьями и сёстрами.","Он наде́ется, что мы ста́нем зави́довать друг дру́гу, критикова́ть и да́же ненави́деть друг дру́га.","Его́ цель — заста́вить нас боро́ться не с ним, а друг с дру́гом."]},
{tag:"복습 2",q:"사탄은 어떻게 전파 활동에 대한 우리의 열의를 꺾으려고 합니까?",ko:"주변 사람들의 반대와 박해를 일으키고, 불공정한 일을 바로잡고 싶은 마음에 사로잡히게 해서, 가장 중요한 일인 전파 활동이 뒤로 밀려나게 만들려고 합니다.",ru:["Сатана́ испо́льзует пресле́дования, что́бы запуга́ть нас и́ли отвле́чь от зада́ния, кото́рое нам поручи́л Иего́ва.","Столкну́вшись с несправедли́востью, мы мо́жем сосредото́читься на том, что́бы доби́ться справедли́вости, и у нас не оста́нется сил и вре́мени для пропове́ди о Ца́рстве."]},
{tag:"복습 3",q:"악한 영의 세력들을 상대로 승리할 수 있다고 당신이 확신하는 이유는 무엇입니까?",ko:"여호와와 예수에 대한 강한 믿음을 유지하고, 형제자매들과 연합을 유지하면 여호와와 예수의 지원을 받아 승리할 수 있기 때문입니다.",ru:["Би́блия заверя́ет нас, что мы мо́жем одержа́ть побе́ду в борьбе́ со злы́ми ду́хами.","Для э́того нам нужна́ си́льная ве́ра в Иего́ву и Иису́са.","Иего́ва и Иису́с обеща́ют помо́чь нам, а бра́тья и сёстры подде́рживают нас в борьбе́ с гла́вным враго́м — Сатано́й."]}
];
const GRAMMAR=[[["не зави́довал Дави́ду: зави́довать(시기하다)는 목적어를 여격으로 취해요. Дави́ду = 다윗(여격).", "а счита́л его́ дру́гом: счита́ть + 대격(его́=그를) + 조격(дру́гом=친구로) = '~를 ~로 여기다'.", "потому́ что = '왜냐하면'. 뒤 절이 사랑한 이유를 설명해요."], ["был смире́нным: 과거 '~였다'의 보어는 조격(смире́нным=겸손한)으로 써요.", "хотя́ = '비록 ~지만(양보)'. 알고도 시기하지 않았다는 대조예요.", "вы́брал его́ сле́дующим царём: сле́дующим царём(다음 왕으로)도 조격 보어예요."], ["Если́ + бу́дем люби́ть: бу́дем + 부정법 = 불완료체 미래 '계속 사랑할 것이다'.", "не оста́нется ме́ста: '자리가 남지 않을 것이다'라는 부정 존재 표현이라 ме́ста는 생격이에요.", "для + 생격: для за́висти = '질투를 위한(자리)'."]], [["не позво́лил, что́бы + 과거형: '~하지 못하게 했다'. что́бы 뒤 과거형은 실제 과거가 아니라 목적·가정이에요.", "переро́с в + 대격: перерасти́ в ~ = '~로 커지다/번지다'. в 뒤 대격 серьёзный конфли́кт.", "ме́жду + 조격: ме́жду пастуха́ми и филистимля́нами(목자들과 블레셋 사람들 사이)."], ["стреми́лся к ми́ру: стреми́ться к + 여격 = '~를 향해 노력하다'. ми́ру는 мир의 여격이에요.", "поэ́тому = '그래서'. сно́ва уступи́л и перешёл — 완료체 과거가 잇달아 일어난 동작을 보여줘요.", "в друго́е ме́сто: 이동 목적지라 в + 대격이에요."], ["Так проявля́л: '그렇게 나타냈다'. проявля́ть(불완료체 과거)는 한 번이 아닌 성품을 말해요.", "목적어는 대격: кро́тость и терпе́ние(온화와 참을성)가 목적어예요."]], [["не должны́ + 부정법: должны́(해야 한다, 복수형) 뒤에 ненави́деть 같은 부정법이 와요.", "ненави́деть тех: ненави́деть + 대격. тех = '그 사람들(대격)'.", "отпла́чивать злом за зло́: злом(악으로, 조격) за зло́(악에 대해, 대격) — '악을 악으로 갚다'는 관용 표현이에요."], ["Сле́дуя призы́ву: сле́дуя는 부동사(불완료체) '~를 따르면서/따라'. 따르는 대상은 여격 призы́ву예요.", "стара́емся проявля́ть: стара́ться + 부정법 = '노력하다'. доброту́, терпе́ние, уваже́ние은 모두 대격 목적어예요.", "да́же = '심지어'. к + 여격: ко всем, к тем(~한 사람들에게도)."]], [["пыта́ется + 부정법: пыта́ться(시도하다) 뒤에 부정법이 와요.", "разру́шить는 완료체: '완전히 깨뜨리다'라는 결과에 초점이 있어요(불완료체 разруша́ть=깨뜨리는 과정).", "еди́нство с + 조격: бра́тьями и сёстрами와(과)의 연합이에요."], ["наде́ется, что ... ста́нем: наде́яться(희망하다) + что 절. ста́нем은 완료체 미래 '~가 될 것이다'예요.", "ста́нем + 부정법들: зави́довать, критикова́ть, ненави́деть가 나란히 이어져요.", "друг дру́гу = '서로에게(여격)'. 서로 시기한다는 뜻이에요."], ["Его́ цель — заста́вить: 대시(—)로 잇는 명사문. цель(목표) 뒤 부정법 구문이 내용을 풀이해요.", "заста́вить нас + 부정법: '~에게 억지로 ~하게 만들다'. 시키는 대상 нас는 대격이에요.", "боро́ться не с ним, а друг с дру́гом: не A, а B = 'A가 아니라 B와'. с + 조격이에요."]], [["испо́льзует пресле́дования: испо́льзовать(이용하다) + 대격 пресле́дования(박해)를 써요.", "что́бы запуга́ть / отвле́чь: что́бы + 완료체 부정법 = '~하도록(목적)'. 겁주다·주의를 돌리다예요.", "кото́рое ... поручи́л: 관계대명사 кото́рое가 зада́ние(과제, 중성)를 받아요."], ["Столкну́вшись: 완료체 부동사 '~에 맞닥뜨리고 나서'. 뒤 주절보다 먼저 일어난 일이에요.", "сосредото́читься на том, что́бы доби́ться: на + 전치격에 집중하고, доби́ться(달성하다)는 생격 справедли́вости를 취해요.", "не оста́нется сил и вре́мени: 부정 존재라 сил, вре́мени가 생격이에요. '힘과 시간이 남지 않다'."]], [["заверя́ет нас, что мо́жем одержа́ть: заверя́ть(확언하다) + что 절. мо́жем + 완료체 부정법 одержа́ть예요.", "одержа́ть побе́ду = '승리를 거두다'라는 고정 표현이에요.", "в борьбе́ со злы́ми ду́хами: борьбе́는 в + 전치격, злы́ми ду́хами는 с + 조격이에요."], ["Для э́того нужна́ си́льная ве́ра: '~가 필요하다' 구문. 주어 ве́ра(여성)에 맞춰 нужна́가 여성형이에요.", "남에게 필요하다는 대상은 여격: '우리에게'는 (нам)으로, ве́ра가 주어예요.", "ве́ра в Иего́ву и Иису́са: в + 대격 = '~에 대한 믿음'이에요."], ["обеща́ют помо́чь: обеща́ть + 부정법 помо́чь(완료체) = '도와주겠다고 약속하다'.", "подде́рживают: 불완료체 현재 '계속 지원하고 있다'예요.", "с гла́вным враго́м: с + 조격. '주된 적과의 싸움에서'라는 뜻이에요."]]];
let idx=0, showStress=true, rate=1;
let ruVoices=[], selectedVoice=-1;
function loadVoices(){
 if(!('speechSynthesis' in window))return;
 const all=speechSynthesis.getVoices();
 ruVoices=all.filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ru')).slice(0,5);
 const saved=localStorage.getItem('wtRuVoiceURI');
 selectedVoice=ruVoices.findIndex(v=>v.voiceURI===saved);
 if(selectedVoice<0) selectedVoice=ruVoices.length?0:-1;
 renderVoices();
}
function renderVoices(){
 const box=document.getElementById('voiceNav'); if(!box)return;
 box.innerHTML=[0,1,2,3,4].map(i=>{
  const v=ruVoices[i];
  if(!v) return `<button disabled>목소리 ${i+1}<small>이 기기에서는 제공되지 않음</small></button>`;
  return `<button class="${i===selectedVoice?'on':''}" onclick="selectVoice(${i})">목소리 ${i+1}<small>${v.name} (${v.lang})</small></button>`;
 }).join('');
}
function selectVoice(i){
 selectedVoice=i;
 if(ruVoices[i]) localStorage.setItem('wtRuVoiceURI',ruVoices[i].voiceURI);
 renderVoices(); setStatus('🔊 목소리 '+(i+1)+' 선택: '+(ruVoices[i]?ruVoices[i].name:''));
}
const clean=s=>s.replace(/\u0301/g,'');
function disp(s){
 return showStress?s:clean(s);
}
function render(){
 const c=CARDS[idx];
 document.getElementById('progressText').textContent=(idx+1)+' / '+CARDS.length;
 document.getElementById('bar').style.width=((idx+1)/CARDS.length*100)+'%';
 document.querySelectorAll('#topNav button').forEach((b,i)=>b.classList.toggle('on',i===idx));
 document.getElementById('card').innerHTML=`
  <div class="meta"><span class="num">${idx+1}</span><span class="tag">${c.tag}</span><span>${idx+1} / ${CARDS.length} 카드</span></div>
  ${c.q?`<div class="q">❓ ${c.q}</div>`:''}
  <p class="ko">${c.ko}</p>
  <div id="ruBox">${c.ru.map((s,i)=>`<p class="ru" onclick="speakSentence(${i},this)" title="눌러서 듣기">${disp(s)}</p>`).join('')}</div>
  <div class="btns">
    <button onclick="speakAll(3)">🔁 반복 3회</button>
    <button onclick="move(-1)">◀ 이전</button><button onclick="move(1)">다음 ▶</button>
  </div>
  <details class="grammar"><summary>📘 문법 해설 보기</summary>
  ${c.ru.map((sent,i)=>`<p class="gru">${disp(sent)}</p><ul>${GRAMMAR[idx][i].map(b=>`<li>${b}</li>`).join('')}</ul>`).join('')}
  </details>`;
 setStatus('');
}
function setStatus(t){document.getElementById('status').textContent=t}
function go(i){idx=i;stopSpeak();render()}
function move(d){idx=(idx+d+CARDS.length)%CARDS.length;stopSpeak();render()}
function toggleStress(){showStress=!showStress;document.getElementById('stressBtn').classList.toggle('active',showStress);render()}
function setRate(r,el){rate=r;document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('active',+b.dataset.rate===r))}
function speakText(text,el){
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(clean(text)); u.lang='ru-RU'; u.rate=rate;
 const v=ruVoices[selectedVoice]||ruVoices[0]; if(v)u.voice=v;
 if(el){el.classList.add('playing'); u.onend=u.onerror=()=>el.classList.remove('playing')}
 speechSynthesis.speak(u); return u;
}
function speakSentence(i,el){speakText(CARDS[idx].ru[i],el)}
function speakAll(times=1){
 const text=CARDS[idx].ru.join(' ');
 let n=0; const play=()=>{ if(n>=times)return; n++; const u=speakText(text); u.onend=()=>setTimeout(play,400); }; play();
 setStatus('▶ 듣는 중... ('+times+'회)');
}
function stopSpeak(){speechSynthesis.cancel();setStatus('⏹ 정지')}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')move(1); else if(e.key==='ArrowLeft')move(-1);
});
if('speechSynthesis' in window){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
render();
</script>
</body></html>
